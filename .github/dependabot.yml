version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-major:
        dependency-type: production
        update-types: ['major']
      all-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Pinned on purpose: the SDK at the oldest supported Paseo, so typechecking
      # proves the plugin uses only that API; react and react-native at what the
      # Paseo app supplies at runtime, since the plugin never bundles them.
      - dependency-name: '@getpaseo/*'
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: '@types/react'
      # Node types follow the oldest Node.js that package.json engines allows.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    # `/` covers the workflows only; the composite action needs its own entry.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: monthly
    groups:
      all-actions:
        patterns: ['*']
